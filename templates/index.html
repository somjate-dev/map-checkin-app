<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกเช็คอิน - Map Check-In</title>
    <!-- CSS UI & Font -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Leaflet.js Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8f9fa; }
        .app-container { max-width: 600px; margin: 20px auto; padding: 15px; }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        #map { height: 250px; border-radius: 8px; margin-top: 15px; border: 1px solid #ddd; }
        .btn-checkin { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); border: none; color: white; }
        .btn-checkin:disabled { background: #cccccc; }
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 9999; display: none;
            justify-content: center; align-items: center; flex-direction: column;
        }
        #camera-preview { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; display: none; }
    </style>
</head>
<body>

<!-- หน้าจอ Loading ดักตอนส่งพิกัด -->
<div id="loading-screen">
    <div class="spinner-border text-success" style="width: 3rem; height: 3rem;" role="status"></div>
    <span class="mt-3 fw-bold text-success">กำลังบันทึกพิกัดและข้อมูลภาพ...</span>
</div>

<div class="container app-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0 fw-bold text-primary">📍 เช็คอินระบุพิกัด</h4>
        <a href="/logout" class="btn btn-outline-danger btn-sm">ออกจากระบบ</a>
    </div>

    <div class="card p-3 mb-3">
        <div class="card-body text-center p-2">
            <h6 class="text-muted">ผู้ใช้งานปัจจุบัน: <span class="badge bg-primary text-white">{{ username }}</span></h6>
        </div>
    </div>

    <!-- ฟอร์มการตรวจสอบ -->
    <form id="checkinForm" enctype="multipart/form-data">
        
        <!-- ส่วนที่ 1: ถ่ายรูป -->
        <div class="card p-3 mb-3">
            <h6 class="fw-bold mb-3">📸 1. ถ่ายภาพยืนยันตน</h6>
            <!-- กดเปิดสิทธิ์กล้องของโทรศัพท์โดยตรง -->
            <input type="file" id="imageInput" name="image" accept="image/*" capture="environment" class="form-control mb-2" required>
            <img id="camera-preview" class="img-thumbnail" alt="Preview ของรูปถ่าย">
        </div>

        <!-- ส่วนที่ 2: พิกัดแผนที่ -->
        <div class="card p-3 mb-3">
            <h6 class="fw-bold mb-2">🗺️ 2. ตรวจสอบพิกัด GPS ของคุณ</h6>
            <button type="button" id="btnGetLocation" class="btn btn-dark w-100 mb-2">ค้นหาตำแหน่งปัจจุบัน 🧭</button>
            
            <div id="locationStatus" class="text-muted small text-center">กรุณากดค้นหาตำแหน่งพิกัดก่อนดำเนินการ</div>
            
            <!-- ช่อง Input ซ่อนค่าพิกัด เพื่อนำส่งหลังบ้าน -->
            <input type="hidden" id="latitude" name="latitude">
            <input type="hidden" id="longitude" name="longitude">
            
            <div id="map"></div>
        </div>

        <button type="submit" id="btnSubmit" class="btn btn-checkin btn-lg w-100 py-3 shadow fw-bold" disabled>ยืนยันเช็คอินระบุตำแหน่ง 🚀</button>
    </form>
</div>

<!-- JS Core, jQuery และ Leaflet Map -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    let map, marker;
    let locationAcquired = false;
    let imageAcquired = false;

    // เริ่มต้นระบบแสดงแผนที่แบบดีฟอลต์ (พิกัดกรุงเทพฯ)
    $(document).ready(function() {
        map = L.map('map').setView([13.7563, 100.5018], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
    });

    // ตรวจสอบสถานะว่าปุ่ม Submit ควรใช้งานได้หรือไม่
    function updateSubmitButton() {
        if(locationAcquired && imageAcquired) {
            $('#btnSubmit').prop('disabled', false);
        } else {
            $('#btnSubmit').prop('disabled', true);
        }
    }

    // ฟังก์ชันพรีวิวภาพที่ผู้ใช้ถ่ายรูปอัปโหลดเข้ามา
    $('#imageInput').on('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                $('#camera-preview').attr('src', e.target.result).show();
            }
            reader.readAsDataURL(file);
            imageAcquired = true;
            updateSubmitButton();
        }
    });

    // ดึงค่า GPS ผ่าน HTML5 Geolocation API
    $('#btnGetLocation').on('click', function() {
        if (!navigator.geolocation) {
            alert('เบราว์เซอร์ของคุณไม่สนับสนุนระบบระบุตำแหน่ง GPS');
            return;
        }

        $('#locationStatus').text('กำลังค้นหาสัญญาณดาวเทียม GPS...');
        
        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // อัปเดตช่องซ่อน
                $('#latitude').val(lat);
                $('#longitude').val(lon);

                $('#locationStatus').html(`<b>ค้นพบพิกัดสำเร็จ:</b> ละติจูด: ${lat.toFixed(6)}, ลองจิจูด: ${lon.toFixed(6)}`);
                
                // เลื่อนแผนที่และแสดงสัญลักษณ์ Pin ปักหมุดตรงพิกัดจริง
                map.setView([lat, lon], 17);
                if (marker) {
                    marker.setLatLng([lat, lon]);
                } else {
                    marker = L.marker([lat, lon]).addTo(map);
                }
                marker.bindPopup("ตำแหน่งเช็คอินของคุณ").openPopup();

                locationAcquired = true;
                updateSubmitButton();
            },
            function(error) {
                console.error(error);
                let msg = 'ไม่สามารถดึงข้อมูลตำแหน่งพิกัดได้';
                if(error.code === error.PERMISSION_DENIED) {
                    msg = 'ผู้ใช้งานปฏิเสธการเข้าถึงสิทธิ์ตำแหน่ง GPS (โปรดตรวจสอบในตั้งค่าเครื่อง)';
                }
                $('#locationStatus').html(`<span class="text-danger">⚠️ เกิดข้อผิดพลาด: ${msg}</span>`);
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    });

    // ส่งข้อมูลแบบ AJAX ด้วย jQuery
    $('#checkinForm').on('submit', function(e) {
        e.preventDefault();
        $('#loading-screen').css('display', 'flex'); // แสดงกล่องโหลดดิ้ง

        let formData = new FormData(this);

        $.ajax({
            url: '/api/checkin',
            type: 'POST',
            data: formData,
            contentType: false,
            processData: false,
            success: function(response) {
                $('#loading-screen').hide();
                if(response.status === 'success') {
                    alert(response.message);
                    window.location.reload(); // รีเฟรชหน้าหลังจากบันทึกแล้ว
                } else {
                    alert('เกิดข้อผิดพลาด: ' + response.message);
                }
            },
            error: function(xhr, status, error) {
                $('#loading-screen').hide();
                alert('ส่งข้อมูลล้มเหลว กรุณาลองอีกครั้ง');
            }
        });
    });
</script>

</body>
</html>
