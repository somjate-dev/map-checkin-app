<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Map Check-In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #9fa8da 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-sm-10">
            <div class="card login-card p-4">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4 fw-bold text-primary">🗺️ Map Check-In</h3>
                    <h6 class="text-muted text-center mb-4">เข้าสู่ระบบเพื่อดำเนินการเช็คอิน</h6>
                    
                    {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                    {% endif %}
                    
                    <form action="/login" method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label text-secondary">ชื่อผู้ใช้งาน (Username)</label>
                            <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="ระบุผู้ใช้ เช่น user01 หรือ admin01" required autocomplete="off">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label text-secondary">รหัสผ่าน (Password)</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">เข้าสู่ระบบ</button>
                    </form>
                    
                    <div class="mt-4 text-center">
                        <small class="text-muted">ทดลองใช้: <b>user01</b> / <b>password123</b> <br>หรือ <b>admin01</b> / <b>admin123</b></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
