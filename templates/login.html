<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบเช็คอินพิกัดตำแหน่ง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #0d3b66 0%, #001e3d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            background: #ffffff;
            overflow: hidden;
        }
        .card-header-bar {
            background: #002855;
            color: white;
            text-align: center;
            padding: 25px 20px 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4 col-sm-10">
            <div class="card login-card">
                <div class="card-header-bar">
                    <h4 class="fw-bold mb-1">📍 Map Check-In</h4>
                    <p class="small mb-0 text-white-50">ระบบบันทึกพิกัดตำแหน่งและรูปถ่าย</p>
                </div>
                <div class="card-body p-4">
                    {% if error %}
                    <div class="alert alert-danger py-2 small text-center" role="alert">{{ error }}</div>
                    {% endif %}

                    <form action="/login" method="POST">
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">ชื่อผู้ใช้งาน</label>
                            <input type="text" class="form-control" name="username" placeholder="user01 หรือ admin01" required autocomplete="off">
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-bold">รหัสผ่าน</label>
                            <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">เข้าสู่ระบบ</button>
                    </form>

                    <div class="mt-4 pt-2 border-top text-center text-muted small">
                        <span>บัญชีทดสอบในระบบ:</span><br>
                        ผู้ใช้ทั่วไป: <b>user01</b> / <b>password123</b><br>
                        เจ้าหน้าที่: <b>admin01</b> / <b>admin123</b>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
